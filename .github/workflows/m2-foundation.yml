name: M2 foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    name: M2 foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/workbench/package-lock.json
      - run: python3 scripts/foundation/manage.py setup
      - run: python3 scripts/foundation/manage.py build
      - run: npx playwright install --with-deps firefox
        working-directory: src/workbench
      - run: python3 scripts/foundation/verify_guest_account.py
      - run: python3 scripts/foundation/verify_cloud_receipt.py
      - run: sudo python3 scripts/foundation/verify_nightly.py
      - run: python3 scripts/foundation/manage.py verify --port 25440
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brickvault-m2-linux-x64
          path: .tools/foundation/release/
          if-no-files-found: error
